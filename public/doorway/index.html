<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DOORWAY</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#08090c;color:#eee;font-family:system-ui}canvas{display:block}#menu{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(#28211b,#08090c);z-index:3;padding:20px}#card{text-align:center;background:#090b10ee;border:1px solid #b99b6555;border-radius:20px;padding:30px;max-width:520px}h1{font-size:52px;letter-spacing:.15em;color:#f5e5c6;margin:0}p{line-height:1.6;color:#ccc}button{padding:14px 20px;border:0;border-radius:10px;background:#e7bc72;font-weight:bold;font-size:15px;touch-action:manipulation}#hud{display:none;position:fixed;inset:0;pointer-events:none}#top{padding:12px;display:flex;justify-content:space-between}#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#000b;padding:8px;border-radius:8px}#mobile{display:none;position:fixed;inset:0;pointer-events:none}#stick,#use,#run,#go{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;background:#111b;color:white;border:1px solid #aaa;width:62px;height:62px}#stick{left:15px;bottom:20px;width:110px;height:110px}#use{right:18px;bottom:25px}#run{right:18px;bottom:100px}#go{right:18px;bottom:175px}#look{position:absolute;right:0;top:20%;width:60%;height:55%;pointer-events:auto;touch-action:none}#err{color:#ffaaaa}@media(max-width:800px),(pointer:coarse){#mobile{display:block}#card{padding:22px}h1{font-size:42px}}</style></head><body><div id="menu"><div id="card"><div style="color:#e7bc72;letter-spacing:.3em">HORROR ADVENTURE</div><h1>DOORWAY</h1><p>HOTEL 001<br>Find the glowing key, unlock the door, and survive the hallway.</p><p>WASD move · Mouse look · E use · Shift run</p><button id="start">ENTER THE HOTEL</button><p id="err"></p><small>iPad: joystick to move, drag the right side to look.</small></div></div><div id="hud"><div id="top"><div>DOOR <span id="room">001</span><br>Keys: <span id="keys">0</span></div><div>HEALTH 100</div></div><div id="hint">Find the glowing key.</div></div><div id="mobile"><div id="stick"></div><div id="look"></div><button id="use">USE</button><button id="run">RUN</button><button id="go">GO</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>(()=>{const $=id=>document.getElementById(id);let scene,camera,renderer,clock,p={x:0,y:1.6,z:4},yaw=0,pitch=0,key,door,started=false,keys=0,stamina=100;let held={},mv={x:0,y:0},last=null;function init(){if(!window.THREE)throw Error('3D engine failed to load. Check your connection and reload.');scene=new THREE.Scene();scene.background=new THREE.Color(0x090b10);scene.fog=new THREE.Fog(0x090b10,9,30);camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));document.body.appendChild(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0xaaaacc,0x20150c,1.3));let lamp=new THREE.PointLight(0xffd49a,3,18);lamp.position.set(0,3,-3);scene.add(lamp);scene.add(camera);for(let [w,h,d,x,y,z,c] of [[8,.2,30,0,0,-4,0x302b28],[8,.2,30,0,4,-4,0x211e1d],[.2,4,30,-4,2,-4,0x4b3b30],[.2,4,30,4,2,-4,0x4b3b30],[2.2,3,.2,0,1.5,-16,0x573721]]){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);scene.add(m);if(z===-16)door=m}key=new THREE.Mesh(new THREE.TorusGeometry(.24,.07,8,18),new THREE.MeshStandardMaterial({color:0xffd52a,emissive:0xff9900,emissiveIntensity:2}));key.rotation.x=Math.PI/2;key.position.set(1,.8,-7);scene.add(key);for(let z=7;z>-17;z-=5){let l=new THREE.PointLight(0xffd6a0,1.3,9);l.position.set(0,3.3,z);scene.add(l)}controls();window.addEventListener('resize',resize);animate()}function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}function controls(){addEventListener('keydown',e=>{held[e.code]=true;if(e.code==='KeyE'||e.code==='Enter')use()});addEventListener('keyup',e=>held[e.code]=false);renderer.domElement.addEventListener('click',()=>{if(innerWidth>800)renderer.domElement.requestPointerLock?.()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.002;pitch=Math.max(-1,Math.min(1,pitch-e.movementY*.002))}});let st=$('stick'),id=null;st.onpointerdown=e=>{id=e.pointerId;st.setPointerCapture(id);sm(e)};st.onpointermove=e=>{if(id===e.pointerId)sm(e)};function sm(e){let r=st.getBoundingClientRect();mv.x=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/44));mv.y=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/44))}function end(){id=null;mv.x=mv.y=0}st.onpointerup=end;st.onpointercancel=end;let look=$('look');look.onpointerdown=e=>{last={x:e.clientX,y:e.clientY};look.setPointerCapture(e.pointerId)};look.onpointermove=e=>{if(last){yaw-=(e.clientX-last.x)*.008;pitch=Math.max(-1,Math.min(1,pitch-(e.clientY-last.y)*.006));last={x:e.clientX,y:e.clientY}}};look.onpointerup=()=>last=null;look.onpointercancel=()=>last=null;$('use').onpointerdown=e=>{e.preventDefault();use()};$('run').onpointerdown=()=>held.run=true;$('run').onpointerup=()=>held.run=false;$('run').onpointercancel=()=>held.run=false;$('go').onpointerdown=()=>held.go=true;$('go').onpointerup=()=>held.go=false;$('go').onpointercancel=()=>held.go=false}function use(){if(!started)return;if(key&&Math.hypot(p.x-key.position.x,p.z-key.position.z)<2.5){scene.remove(key);key=null;keys++;$('keys').textContent=keys;$('hint').textContent='Key collected! Go to the door.';return}if(p.z<-12&&Math.abs(p.x)<2){if(keys){keys--;roomUp()}else $('hint').textContent='Locked! Find the glowing key first.'}else $('hint').textContent='Look for the glowing key.'}function roomUp(){keys=0;$('keys').textContent=0;$('room').textContent=String(Number($('room').textContent)+1).padStart(3,'0');p.z=4;p.x=0;scene.remove(key);key=new THREE.Mesh(new THREE.TorusGeometry(.24,.07,8,18),new THREE.MeshStandardMaterial({color:0xffd52a,emissive:0xff9900,emissiveIntensity:2}));key.rotation.x=Math.PI/2;key.position.set(Math.random()*2-1,.8,-7);scene.add(key);$('hint').textContent='New room. Find the key.'}function animate(){requestAnimationFrame(animate);if(!renderer)return;let dt=Math.min(clock.getDelta(),.05);if(started){camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);let f=(held.KeyW||held.ArrowUp||held.go?1:0)-(held.KeyS||held.ArrowDown?1:0)-mv.y,s=(held.KeyD||held.ArrowRight?1:0)-(held.KeyA||held.ArrowLeft?1:0)+mv.x,spd=(held.ShiftLeft||held.ShiftRight||held.run)?5:3,n=Math.max(1,Math.hypot(f,s));let nx=p.x+(-Math.sin(yaw)*f+Math.cos(yaw)*s)/n*spd*dt,nz=p.z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)/n*spd*dt;if(nx>-3.4&&nx<3.4)p.x=nx;if(nz<5&&nz>-15)p.z=nz;camera.position.set(p.x,p.y,p.z);if(key){key.rotation.z+=dt*1.5;key.position.y=.8+Math.sin(performance.now()*.003)*.12}}renderer.render(scene,camera)}$('start').addEventListener('click',e=>{e.preventDefault();try{if(!renderer)init();started=true;p={x:0,y:1.6,z:4};yaw=pitch=0;keys=0;$('keys').textContent='0';$('room').textContent='001';$('menu').style.display='none';$('hud').style.display='block';$('err').textContent='';$('hint').textContent='Find the glowing key.'}catch(e){console.error(e);$('err').textContent='Could not start: '+e.message}})})();</script></body></html>
