name: Shadow Ops CI and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Smoke test backend and Socket.IO
        run: |
          npm start > /tmp/shadow-ops.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/health.json'));if(!x.ok)process.exit(1)"
          curl -fsS http://127.0.0.1:3000/socket.io/socket.io.js >/dev/null
          curl -fsS http://127.0.0.1:3000/ | grep -q "TACTICAL FPS"
  deploy-pages:
    needs: test-backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload browser client
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
